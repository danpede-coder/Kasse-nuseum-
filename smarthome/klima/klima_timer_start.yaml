# script.klima_timer_start (Repo-Kopie der Live-Config)
alias: Klima Timer Start
description: >-
  Aus-Timer: startet timer.klima_timer mit der Dauer aus den Slidern 'Klima Timer Stunden' +
  'Klima Timer Minuten'. Ist die Klimaanlage aus, wird sie im zuletzt genutzten Modus eingeschaltet;
  läuft sie schon, bleibt ihr Modus unverändert (Modus am Thermostat). Das Ausschalten übernimmt die
  Automation 'Klima Timer abgelaufen'. Startet nur, wenn die Dauer > 0 ist.
icon: mdi:timer-play-outline
mode: restart
sequence:
  - condition: or
    conditions:
      - condition: numeric_state
        entity_id: input_number.klima_timer_st
        above: 0
      - condition: numeric_state
        entity_id: input_number.klima_timer_min
        above: 0
  - if:
      - condition: state
        entity_id: climate.klimaanlage
        state: "off"
    then:
      - action: climate.turn_on
        target:
          entity_id: climate.klimaanlage
  - action: timer.start
    target:
      entity_id: timer.klima_timer
    data:
      duration: "{{ (states('input_number.klima_timer_st')|int(0) * 3600) + (states('input_number.klima_timer_min')|int(0) * 60) }}"

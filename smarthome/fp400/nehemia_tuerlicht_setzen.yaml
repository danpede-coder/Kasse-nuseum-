# script.nehemia_tuerlicht_setzen
# Schaltet das Matter-Tuerlicht fuer die Nehemia-Lichtsteuerung. Wird per script.turn_on
# aufgerufen (blockiert nicht): ein nicht antwortendes Matter-Geraet haengt sonst 37 s pro
# Aufruf und staut die queued-Automation. mode restart ersetzt einen haengenden Aufruf.
alias: Nehemia Tuerlicht setzen (entkoppelt)
mode: restart
icon: mdi:lightbulb-night
fields:
  an:
    name: An
    description: true = 1 % Orientierungslicht (2700 K), false = aus
    required: true
    selector:
      boolean: {}
sequence:
  - if:
      - condition: template
        value_template: "{{ an | bool(false) }}"
    then:
      - action: light.turn_on
        target:
          entity_id: light.zimmer_nehemia_tur_licht
        data:
          brightness_pct: 1
          color_temp_kelvin: 2700
          transition: 1
        continue_on_error: true
    else:
      - action: light.turn_off
        target:
          entity_id: light.zimmer_nehemia_tur_licht
        data:
          transition: 3
        continue_on_error: true

# Zugehoeriger Template-Helfer (UI: Helfer > Template > Binaersensor):
#   Name:     Nehemia Tuerlicht erreichbar  -> binary_sensor.nehemia_tuerlicht_erreichbar
#   Zustand:  {{ states('light.zimmer_nehemia_tur_licht') not in ['unavailable', 'unknown'] }}
#   delay_on: 15 min (erst nach 15 min stabiler Verbindung "erreichbar")
